# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    tags:
      - containers_image_openpgp
    flags:
      - -trimpath
    ldflags:
      - -w -s -extldflags '-static'
      - -X github.com/containers/skopeo/version.Version={{.Env.GENERATED_VERSION}}
    main: ./cmd/skopeo/
    binary: alauda-skopeo

archives:
  - id: archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    This release is intended for use only as part of the Alauda product suite.
    It is not recommended for use by individuals or teams outside of Alauda.
    Any consequences arising from its use are the sole responsibility of the user.
