apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: skopeo
  title: Skopeo
  description: containers/skopeo 的 Alauda fork，是一个无需 daemon 运行的容器镜像操作命令行工具，支持跨镜像仓库复制、检查和签名等操作。在 Tekton 流水线中用于镜像同步和制品管理场景。
  tags:
    - tool
    - container
    - open-source-fork
  links:
    - url: https://github.com/AlaudaDevops/skopeo
      title: GitHub Repository
      icon: github
    - url: https://github.com/containers/skopeo
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/skopeo
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/containers/skopeo
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: Apache
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/containers/skopeo/blob/main/LICENSE
    # backstage techdocs plugin — dir:../ points to the repo root from .catalog/
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: qingliu@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: service
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
